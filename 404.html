<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Muhammed Anshif KT</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found { min-height: 100vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 25px; width: min(900px, calc(100% - 80px)); margin: 0 auto; }
        .not-found .label { color: var(--color-muted); font-size: 12px; font-weight: 700; letter-spacing: 3px; }
        .not-found h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(70px, 14vw, 160px); line-height: 0.9; letter-spacing: -5px; }
        .not-found p { max-width: 520px; color: var(--color-body); font-size: 18px; line-height: 1.7; }
    </style>
</head>
<body>
    <main class="not-found">
        <p class="label">404 / NOT FOUND</p>
        <h1>Nothing here.</h1>
        <p>The page you're looking for doesn't exist or has moved. Head back to the homepage to see my projects, experience and skills.</p>
        <a href="/" class="button primary-button">Back to Home <span>→</span></a>
    </main>
</body>
</html>
